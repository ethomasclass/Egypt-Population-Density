<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Allocation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ── tokens ─────────────────────────────────────────────── */
:root{
  --ground:#E8EAE6; --panel:#F7F8F6; --panel-2:#DFE3DE; --sunk:#D5DAD4;
  --ink:#16191C; --ink-2:#565E64; --ink-3:#7C858B;
  --rule:#C3CAC3; --rule-2:#AEB6AE;
  --seal:#1F4E5F; --seal-soft:#D9E4E7;
  --critical:#9E2B1E; --critical-soft:#F0DCD8;
  --watch:#8A5D12; --watch-soft:#F0E5CE;
  --stable:#2F6B4F; --stable-soft:#D9E7DF;
  --shadow:rgba(22,25,28,.13);
  --d-display:"Archivo Narrow","Arial Narrow",Helvetica,sans-serif;
  --d-body:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;
  --d-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101315; --panel:#191D20; --panel-2:#22272A; --sunk:#0B0E10;
    --ink:#E2E6E2; --ink-2:#98A2A6; --ink-3:#6E787D;
    --rule:#2F373B; --rule-2:#3D474C;
    --seal:#6FB2C6; --seal-soft:#16303A;
    --critical:#DE7060; --critical-soft:#3A1B16;
    --watch:#D2A249; --watch-soft:#332812;
    --stable:#6FB68C; --stable-soft:#152E22;
    --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#101315; --panel:#191D20; --panel-2:#22272A; --sunk:#0B0E10;
  --ink:#E2E6E2; --ink-2:#98A2A6; --ink-3:#6E787D;
  --rule:#2F373B; --rule-2:#3D474C;
  --seal:#6FB2C6; --seal-soft:#16303A;
  --critical:#DE7060; --critical-soft:#3A1B16;
  --watch:#D2A249; --watch-soft:#332812;
  --stable:#6FB68C; --stable-soft:#152E22;
  --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font:400 15px/1.5 var(--d-body);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.num{font-family:var(--d-mono);font-variant-numeric:tabular-nums}
.lbl{
  font-family:var(--d-display);font-weight:600;font-size:11px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
}

/* ── boot / login ───────────────────────────────────────── */
#login{position:fixed;inset:0;z-index:60;background:var(--sunk);
  display:flex;align-items:center;justify-content:center;padding:24px}
.boot{width:min(620px,100%);font-family:var(--d-mono);font-size:13px;color:var(--ink-2)}
.boot .seal{
  font-family:var(--d-display);font-weight:700;font-size:30px;letter-spacing:.03em;
  color:var(--ink);line-height:1.1;margin-bottom:2px;text-transform:uppercase
}
.boot .sub{font-family:var(--d-display);font-size:13px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--seal);margin-bottom:26px}
.boot ul{list-style:none;margin:0 0 22px;padding:0;min-height:96px}
.boot li{opacity:0;animation:fade .28s ease forwards;display:flex;gap:10px}
.boot li b{color:var(--stable);font-weight:500}
@keyframes fade{to{opacity:1}}
.card{background:var(--panel);border:1px solid var(--rule);padding:22px 24px 24px;
  box-shadow:0 1px 0 var(--rule-2)}
.card h2{font-family:var(--d-display);font-weight:600;font-size:17px;letter-spacing:.04em;
  text-transform:uppercase;margin:0 0 4px}
.card p.hint{margin:0 0 18px;font-size:13.5px;color:var(--ink-2);max-width:62ch}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
label.f{display:flex;flex-direction:column;gap:5px}
input[type=text]{
  font:400 15px/1.4 var(--d-body);background:var(--ground);color:var(--ink);
  border:1px solid var(--rule-2);border-bottom-width:2px;padding:8px 10px;border-radius:0
}
input[type=text]::placeholder{color:var(--ink-3)}
.btn{
  font-family:var(--d-display);font-weight:600;font-size:14px;letter-spacing:.09em;
  text-transform:uppercase;background:var(--seal);color:var(--panel);
  border:1px solid var(--seal);padding:10px 22px;border-radius:0
}
.btn[disabled]{background:var(--panel-2);color:var(--ink-3);border-color:var(--rule-2);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--seal)}
.btn.sm{font-size:12px;padding:6px 12px}
.linkish{background:none;border:0;padding:0;color:var(--seal);text-decoration:underline;
  font-size:13px;font-family:var(--d-body)}

/* ── shell ──────────────────────────────────────────────── */
#app{display:none;height:100%;flex-direction:column}
#app.on{display:flex}
.topbar{
  display:flex;align-items:center;gap:18px;padding:0 14px;height:46px;flex:0 0 auto;
  background:var(--seal);color:#F7F8F6;border-bottom:1px solid var(--rule-2)
}
:root[data-theme="dark"] .topbar,
:root:not([data-theme="light"]) .topbar{color:var(--sunk)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .topbar{color:#F7F8F6}}
.topbar .org{font-family:var(--d-display);font-weight:700;font-size:15px;letter-spacing:.09em;
  text-transform:uppercase;white-space:nowrap}
.topbar .meta{font-family:var(--d-mono);font-size:12px;opacity:.86;white-space:nowrap}
.topbar .spacer{flex:1}
.roundchip{
  font-family:var(--d-display);font-weight:600;font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;border:1px solid currentColor;padding:3px 10px
}
.main{flex:1;display:grid;grid-template-columns:236px minmax(0,1fr) 268px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.col.rail{border-right:1px solid var(--rule)}
.col.alloc{border-left:1px solid var(--rule)}
.col.doc{background:var(--ground)}
.colhead{
  flex:0 0 auto;padding:9px 12px 8px;border-bottom:1px solid var(--rule);
  background:var(--panel-2);display:flex;align-items:center;gap:8px
}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0}

/* ── case file rail ─────────────────────────────────────── */
.filelist{list-style:none;margin:0;padding:6px 0}
.filelist li{margin:0}
.fileitem{
  width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);
  padding:9px 12px;display:flex;gap:9px;align-items:flex-start;line-height:1.35
}
.fileitem:hover{background:var(--panel-2)}
.fileitem[aria-current="true"]{background:var(--seal-soft);
  box-shadow:inset 3px 0 0 var(--seal)}
.fileitem .t{font-size:13.5px;font-weight:500}
.fileitem .s{font-family:var(--d-mono);font-size:11px;color:var(--ink-3);display:block;margin-top:2px}
.fileitem .dot{width:7px;height:7px;border-radius:50%;background:var(--rule-2);
  margin-top:6px;flex:0 0 auto}
.fileitem.unread .dot{background:var(--critical);box-shadow:0 0 0 3px var(--critical-soft)}
.fileitem.locked{opacity:.42;cursor:not-allowed}
.fileitem.locked:hover{background:none}

/* calculation bench */
.bench{flex:0 0 auto;border-top:2px solid var(--rule-2);background:var(--panel-2);padding:10px 12px 12px}
.bench h3{margin:0 0 3px;font-family:var(--d-display);font-weight:600;font-size:12px;
  letter-spacing:.11em;text-transform:uppercase}
.bench .why{font-size:11.5px;color:var(--ink-2);margin:0 0 9px;line-height:1.4}
.benchrow{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.benchrow span{flex:1;font-size:13px}
.benchrow input{
  width:76px;font:500 13px var(--d-mono);text-align:right;padding:5px 6px;
  background:var(--panel);color:var(--ink);border:1px solid var(--rule-2);border-radius:0
}
.benchrow input.ok{border-color:var(--stable);background:var(--stable-soft)}
.benchrow input.no{border-color:var(--critical);background:var(--critical-soft)}
.benchrow .mark{width:14px;font-family:var(--d-mono);font-size:13px;text-align:center}
.benchmsg{font-size:11.5px;line-height:1.4;margin-top:7px;color:var(--ink-2);min-height:16px}

/* ── document pane ──────────────────────────────────────── */
.docwrap{padding:18px 22px 28px;max-width:820px}
.docmeta{border-bottom:2px solid var(--ink);padding-bottom:9px;margin-bottom:16px}
.docmeta .from{font-family:var(--d-mono);font-size:11.5px;color:var(--ink-2);
  display:flex;flex-wrap:wrap;gap:14px;margin-bottom:6px}
.docmeta h1{font-family:var(--d-display);font-weight:700;font-size:23px;letter-spacing:.02em;
  text-transform:uppercase;margin:0;text-wrap:balance;line-height:1.15}
.stamp{
  display:inline-block;font-family:var(--d-display);font-weight:600;font-size:11px;
  letter-spacing:.13em;text-transform:uppercase;padding:2px 7px;border:1px solid currentColor
}
.stamp.crit{color:var(--critical)}
.stamp.watch{color:var(--watch)}
.docwrap p{margin:0 0 12px;max-width:66ch;font-size:14.5px}
.docwrap h2{font-family:var(--d-display);font-weight:600;font-size:14px;letter-spacing:.1em;
  text-transform:uppercase;margin:22px 0 8px;color:var(--ink-2);
  border-bottom:1px solid var(--rule);padding-bottom:4px}
.tablewrap{overflow-x:auto;margin:0 0 14px}
table.data{border-collapse:collapse;width:100%;font-size:14px;background:var(--panel)}
table.data th,table.data td{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:right}
table.data th{
  font-family:var(--d-display);font-weight:600;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--rule-2);
  vertical-align:bottom;line-height:1.25
}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data td.n{font-family:var(--d-mono);font-variant-numeric:tabular-nums;font-weight:500}
table.data tr.hi td{background:var(--seal-soft)}
table.data tr.ref td{color:var(--ink-2);font-style:normal}
table.data caption{caption-side:bottom;text-align:left;font-size:11.5px;color:var(--ink-3);
  padding-top:6px;line-height:1.45}
.flip td.n{transition:none}
.note{border-left:3px solid var(--seal);background:var(--panel);padding:11px 14px;
  margin:0 0 14px;font-size:13.5px;color:var(--ink-2);max-width:66ch}
.note strong{color:var(--ink)}
.note.crit{border-left-color:var(--critical)}
/* distribution schematics */
.patterns{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.pat{background:var(--panel);border:1px solid var(--rule);padding:9px}
.pat svg{display:block;width:100%;height:88px;background:var(--sunk)}
.pat .cap{font-family:var(--d-display);font-weight:600;font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;margin-top:7px}
.pat .sub{font-family:var(--d-mono);font-size:11px;color:var(--ink-3);margin-top:1px}
/* deliberation */
.delib{background:var(--panel);border:1px solid var(--rule-2);border-top:3px solid var(--watch);
  padding:14px 16px 16px;margin:22px 0 0}
.delib h2{margin-top:0;border:0;padding:0;color:var(--watch)}
.dq{display:flex;gap:10px;align-items:flex-start;margin-bottom:11px;font-size:14px;max-width:70ch}
.dq input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--seal);flex:0 0 auto}
.dq label{cursor:pointer}
.delib textarea{
  width:100%;max-width:70ch;min-height:64px;font:400 14px/1.5 var(--d-body);
  background:var(--ground);color:var(--ink);border:1px solid var(--rule-2);
  border-bottom-width:2px;padding:8px 10px;border-radius:0;resize:vertical
}
.delib .req{font-size:13px;font-weight:500;margin:0 0 6px}

/* ── allocation panel ───────────────────────────────────── */
.allocbody{padding:10px 12px}
.arow{margin-bottom:11px}
.arow .top{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.arow .nm{flex:1;font-size:13.5px;font-weight:500}
.arow .amt{font-family:var(--d-mono);font-size:13px;font-weight:600}
.arow .bar{height:9px;background:var(--sunk);border:1px solid var(--rule);position:relative}
.arow .bar i{display:block;height:100%;background:var(--seal);transition:width .18s ease}
.arow .bar u{position:absolute;top:0;bottom:0;border-right:2px dashed var(--ink-3);opacity:.7}
.steps{display:flex;gap:4px;margin-top:5px}
.steps button{
  flex:1;font:600 13px var(--d-mono);background:var(--panel-2);border:1px solid var(--rule-2);
  padding:3px 0;border-radius:0
}
.steps button:hover:not([disabled]){background:var(--seal-soft);border-color:var(--seal)}
.steps button[disabled]{opacity:.35;cursor:not-allowed}
.tally{border-top:2px solid var(--rule-2);margin-top:4px;padding-top:9px}
.tally .r{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.tally .r .v{font-family:var(--d-mono);font-weight:600}
.tally .r.bad .v{color:var(--critical)}
.tally .r.good .v{color:var(--stable)}
.gate{font-size:11.5px;color:var(--ink-2);line-height:1.4;margin:8px 0 9px;min-height:30px}
.gate b{color:var(--critical)}
.allocfoot{flex:0 0 auto;border-top:1px solid var(--rule);padding:10px 12px;background:var(--panel-2)}
.allocfoot .btn{width:100%}
.priorbox{border-top:1px solid var(--rule);margin-top:12px;padding-top:9px}
.priorbox table{width:100%;border-collapse:collapse;font-size:11.5px}
.priorbox td{padding:2px 0;color:var(--ink-2)}
.priorbox td.n{font-family:var(--d-mono);text-align:right;font-variant-numeric:tabular-nums}
.locked-note{font-size:12px;color:var(--stable);font-weight:500;text-align:center;padding:4px 0}

/* ── memo ───────────────────────────────────────────────── */
#memo{position:fixed;inset:0;z-index:70;background:var(--ground);overflow-y:auto;display:none}
#memo.on{display:block}
.memopage{max-width:760px;margin:0 auto;padding:34px 30px 60px}
.memohead{border-bottom:3px double var(--ink);padding-bottom:12px;margin-bottom:20px}
.memohead .org{font-family:var(--d-display);font-weight:700;font-size:19px;letter-spacing:.09em;
  text-transform:uppercase}
.memohead .sub{font-family:var(--d-display);font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--seal);margin-top:2px}
.memopage h1{font-family:var(--d-display);font-weight:700;font-size:25px;text-transform:uppercase;
  letter-spacing:.02em;margin:20px 0 12px}
.memogrid{display:grid;grid-template-columns:120px 1fr;gap:4px 14px;font-size:14px;margin-bottom:22px}
.memogrid dt{font-family:var(--d-display);font-weight:600;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);padding-top:3px}
.memogrid dd{margin:0;font-weight:500}
.memopage h2{font-family:var(--d-display);font-weight:600;font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;border-bottom:1px solid var(--rule-2);padding-bottom:4px;margin:24px 0 10px}
.qa{margin-bottom:14px}
.qa .q{font-size:13px;color:var(--ink-2);margin-bottom:3px}
.qa .a{font-size:14.5px;border-left:3px solid var(--seal);padding-left:11px;
  white-space:pre-wrap;min-height:20px}
.sig{margin-top:32px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.sig div{border-top:1px solid var(--ink);padding-top:5px;font-size:12px;color:var(--ink-2)}
.memoactions{display:flex;gap:10px;margin-top:30px}

/* ── instructor notes ───────────────────────────────────── */
#notes{position:fixed;inset:0;z-index:80;background:var(--ground);overflow-y:auto;display:none}
#notes.on{display:block}
.notespage{max-width:780px;margin:0 auto;padding:34px 30px 70px}
.notespage h1{font-family:var(--d-display);font-weight:700;font-size:26px;text-transform:uppercase;
  letter-spacing:.02em;margin:0 0 6px}
.notespage h2{font-family:var(--d-display);font-weight:600;font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;border-bottom:1px solid var(--rule-2);padding-bottom:4px;margin:26px 0 10px}
.notespage p,.notespage li{font-size:14.5px;max-width:70ch}
.notespage li{margin-bottom:6px}
.notespage code{font-family:var(--d-mono);font-size:13px;background:var(--panel-2);padding:1px 4px}

/* ── maps ───────────────────────────────────────────────── */
:root{
  --ramp1:#DEE6E8; --ramp2:#B7CBD1; --ramp3:#8BADB7; --ramp4:#568795; --ramp5:#22596A;
  --land:#DCE0DA; --landline:#96A09B;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ramp1:#1A272C; --ramp2:#243F48; --ramp3:#335E6D; --ramp4:#4C8697; --ramp5:#78B5C5;
    --land:#232A2E; --landline:#4C575C;
  }
}
:root[data-theme="dark"]{
  --ramp1:#1A272C; --ramp2:#243F48; --ramp3:#335E6D; --ramp4:#4C8697; --ramp5:#78B5C5;
  --land:#232A2E; --landline:#4C575C;
}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:0 0 12px}
.mapcell{background:var(--panel);border:1px solid var(--rule);padding:9px 9px 10px}
.mapcell svg{display:block;width:100%;height:auto;background:var(--sunk)}
.mapcell .nm{font-family:var(--d-display);font-weight:600;font-size:13px;letter-spacing:.05em;
  text-transform:uppercase;margin-top:8px}
.mapcell .sub{font-family:var(--d-mono);font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.maplegend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);
  margin:0 0 16px;padding:8px 11px;background:var(--panel);border:1px solid var(--rule)}
.maplegend .swatches{display:flex;gap:2px}
.maplegend .swatches i{width:26px;height:11px;display:block;border:1px solid var(--rule)}
.lenstoggle{display:flex;gap:0;border:1px solid var(--rule-2);width:fit-content;margin:0 0 12px}
.lensbtn{background:var(--panel);border:0;padding:7px 14px;font-family:var(--d-display);font-weight:600;
  font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.lensbtn+.lensbtn{border-left:1px solid var(--rule-2)}
.lensbtn.on{background:var(--seal);color:var(--panel)}
/* arable inset figure */
.arablefig{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin:0 0 14px}
.arablefig .cell{background:var(--panel);border:1px solid var(--rule);padding:9px}
.arablefig .box{position:relative;background:var(--land);border:1px solid var(--landline);
  aspect-ratio:1/1;overflow:hidden}
.arablefig .box i{position:absolute;left:0;bottom:0;background:var(--seal);display:block}
.arablefig .cap{font-family:var(--d-display);font-weight:600;font-size:12.5px;letter-spacing:.05em;
  text-transform:uppercase;margin-top:7px}
.arablefig .val{font-family:var(--d-mono);font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.45}
/* ── receipt ────────────────────────────────────────────── */
#receipt{position:fixed;inset:0;z-index:74;background:rgba(8,12,14,.6);display:none;
  align-items:center;justify-content:center;padding:24px}
#receipt.on{display:flex}
.rcard{width:min(470px,100%);background:var(--panel);border:1px solid var(--rule-2);
  border-top:3px solid var(--seal);padding:20px 22px 22px;box-shadow:0 10px 34px rgba(0,0,0,.4)}
.rcard .k{font-family:var(--d-mono);font-size:11.5px;color:var(--ink-3);margin-bottom:5px}
.rcard h3{font-family:var(--d-display);font-weight:700;font-size:19px;letter-spacing:.03em;
  text-transform:uppercase;margin:0 0 10px}
.rcard .head{font-size:15px;line-height:1.55;margin:0 0 16px;max-width:52ch}
.rcard .head b{color:var(--seal)}
.rrow{display:grid;grid-template-columns:112px 1fr 78px;align-items:center;gap:9px;margin-bottom:7px}
.rrow .lab{font-size:12.5px;color:var(--ink-2)}
.rrow .track{height:10px;background:var(--sunk);border:1px solid var(--rule)}
.rrow .track i{display:block;height:100%;background:var(--seal)}
.rrow .w{font-family:var(--d-mono);font-size:11px;color:var(--ink-3);text-align:right}
.rcard .foot{margin-top:16px;display:flex;gap:10px;align-items:center}

function rampStep(v,vals){
  // log scale: these measures span orders of magnitude
  const ls=vals.map(x=>Math.log10(Math.max(1,x)));
  const lo=Math.min.apply(null,ls), hi=Math.max.apply(null,ls);
  const t = hi===lo ? 0.5 : (Math.log10(Math.max(1,v))-lo)/(hi-lo);
  return "var(--ramp"+Math.max(1,Math.min(5,Math.ceil(t*5)||1))+")";
}

function markInner(dense){

    for(let r=0;r<2;r++) for(let i=0;i<12;i++)

  } else {
    for(let i=0;i<5;i++) d+='<circle cx="'+(18+i*7)+'" cy="32" r="2.9"/>';
  }
  const top = dense?27.4:26.0, bot = dense?36.8:38.0, R = dense?26:29;
  const cid = "arableclip"+(dense?"L":"S");
  return '<clipPath id="'+cid+'"><circle cx="32" cy="32" r="'+R+'"/></clipPath>'+
    '<g clip-path="url(#'+cid+')">'+

    '<g fill="currentColor">'+d+'</g></g>';
}

function dots(pattern){
  const pts=[];
  const R=(s)=>{let x=Math.sin(s*127.1)*43758.5;return x-Math.floor(x);};
  for(let i=0;i<46;i++){
    let x,y;
    if(pattern==="linear"){ const t=i/45; x=14+t*72+ (R(i)*8-4); y=8+t*76+(R(i+90)*10-5); }
    else if(pattern==="clustered"){
      if(i<34){ x=52+(R(i)-0.5)*30; y=62+(R(i+40)-0.5)*26; }
      else { x=8+R(i+7)*84; y=6+R(i+70)*80; }
    } else { x=6+R(i)*88; y=6+R(i+55)*80; }
    pts.push([Math.max(3,Math.min(97,x)),Math.max(4,Math.min(94,y))]);
  }
  return pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.1" fill="var(--seal)" opacity=".85"/>').join("");
}

function wireDelib(){

/* ── calculation bench ── */
function renderBench(){
  const spec=ROUNDS[S.round].bench, box=document.getElementById("bench");
  const ids=spec&&spec.ids;
  if(!spec){
    box.hidden=true; S.benchOk=true;
    document.querySelector("#bench h3").textContent="Calculation Bench";
    document.getElementById("benchrows").innerHTML="";
    document.getElementById("benchmsg").textContent="";
    return;
  }
  box.hidden=false; S.benchOk=false;
  const M=MEASURES[spec.m];
  document.querySelector("#bench h3").textContent=M.label;
  document.getElementById("benchwhy").innerHTML =
    M.formula+", to the nearest whole number. The round cannot be locked until every "+
    "entry is verified.<br><span style=\"color:var(--ink-3)\">"+M.ex+"</span>";
  const rows=document.getElementById("benchrows"); rows.innerHTML="";
  ids.forEach(id=>{
    const c=byId(id);
    const row=document.createElement("div"); row.className="benchrow";
    row.innerHTML='<span>'+c.name+'</span><input type="text" inputmode="numeric" '+
      'aria-label="Physiological density for '+c.name+'" data-id="'+id+'">'+
      '<span class="mark" data-mark="'+id+'"></span>';
    rows.appendChild(row);
  });
  rows.querySelectorAll("input").forEach(inp=>inp.addEventListener("input",checkBench));
  checkBench();
}
function checkBench(){
  const spec=ROUNDS[S.round].bench; if(!spec) return;
  const ids=spec.ids;
  let allOk=true, anyTyped=false, near=false;
  ids.forEach(id=>{
    const inp=document.querySelector('#benchrows input[data-id="'+id+'"]');
    const mark=document.querySelector('[data-mark="'+id+'"]');
    const target=byId(id)[spec.m];
    const v=parseFloat(inp.value.replace(/[, ]/g,""));
    inp.classList.remove("ok","no"); mark.textContent="";
    if(!inp.value.trim()){ allOk=false; return; }
    anyTyped=true;
    if(isFinite(v) && Math.abs(v-target)/target <= 0.03){
      inp.classList.add("ok"); mark.textContent="✓"; mark.style.color="var(--stable)";
    } else {
      inp.classList.add("no"); mark.textContent="✗"; mark.style.color="var(--critical)";
      allOk=false;
      if(isFinite(v) && Math.abs(v-target)/target<=0.35) near=true;
    }
  });
  S.benchOk=allOk;
  const msg=document.getElementById("benchmsg");
  msg.textContent = allOk ? "Verified and recorded on the case file."
    : near ? "Close. Check which two figures you divided."
    : anyTyped ? "Check your arithmetic — "+MEASURES[spec.m].hint
    : "";
  if(allOk && !availableDocs().includes("arable")){}
  renderRail(); updateGate();
}

function updateTally(){
  const r=ROUNDS[S.round];
  const t=CANDIDATES.reduce((s,c)=>s+S.alloc[c.id],0);
  const row=document.getElementById("tallyRow");
  document.getElementById("tallyV").textContent="$"+t+"M";
  document.getElementById("remV").textContent="$"+(r.budget-t)+"M";
  row.className="r "+(t===r.budget?"good":"bad");
  // disable + when full
  document.querySelectorAll('.steps button[data-d="'+r.step+'"]').forEach(b=>{
    b.disabled = t+r.step > r.budget;
  });
  updateGate();
}
function updateGate(){
  const r=ROUNDS[S.round];
  const total=CANDIDATES.reduce((s,c)=>s+S.alloc[c.id],0);
  const allChecked=r.checks.every((q,i)=>S.checks[S.round+"-"+i]);
  const answered=(S.answers[S.round]||"").trim().length>=25;
  const missing=[];
  if(!S.benchOk) missing.push("Calculation Bench incomplete");
  if(total!==r.budget) missing.push("fund not fully committed ($"+(r.budget-total)+"M left)");
  if(!allChecked) missing.push("deliberation items not confirmed");
  if(!answered) missing.push("written response too short");
  if(!allChecked || !answered){
    const a=DOCS[r.anchor];
    if(S.openDoc!==r.anchor) missing.push("deliberation is on \u201c"+a.title+"\u201d");
  }
  const g=document.getElementById("gatemsg");
  g.innerHTML = missing.length
    ? r.gate+"<br><b>Blocked:</b> "+missing.join("; ")+"."
    : "Ready to lock. Once locked, this round's allocation is recorded.";
  const btn=document.getElementById("lockBtn");
  btn.disabled = missing.length>0;
  btn.textContent = S.round===4? "Issue Recommendation" : "Lock Round "+S.round;
}

function enterRound(n){
  S.round=n;
  const r=ROUNDS[n];
  document.getElementById("roundchip").textContent=r.title;
  // the round's headline document opens automatically; the deliberation
  // gate lives on r.anchor, so every round forces at least two documents open.
  S.openDoc = r.open; S.read[r.open] = true;
  renderBench(); renderRail(); renderDoc(); renderAlloc();
}
document.getElementById("roleBtn").addEventListener("click",()=>{
  S.role = S.role==="data" ? "country":"data"; renderDoc();
});
document.getElementById("lockBtn").addEventListener("click",()=>{
  const snap={}; CANDIDATES.forEach(c=>snap[c.id]=S.alloc[c.id]);
  S.history.push({round:S.round,budget:ROUNDS[S.round].budget,alloc:snap,
    answer:S.answers[S.round]||""});
  if(S.round===1){
    S.disbursed={}; CANDIDATES.forEach(c=>S.disbursed[c.id]=snap[c.id]/100*25);
  }
  if(S.round===4){ showReceipt(4,snap,()=>showAftermath(showMemo)); return; }
  const next=S.round+1;
  if(ROUNDS[next].budget!==ROUNDS[S.round].budget){
    const scale=ROUNDS[next].budget/ROUNDS[S.round].budget;
    CANDIDATES.forEach(c=>S.alloc[c.id]=Math.round(snap[c.id]*scale/ROUNDS[next].step)*ROUNDS[next].step);
    let t=CANDIDATES.reduce((s,c)=>s+S.alloc[c.id],0);
    while(t>ROUNDS[next].budget){
      const big=CANDIDATES.slice().sort((a,b)=>S.alloc[b.id]-S.alloc[a.id])[0];
      S.alloc[big.id]-=ROUNDS[next].step; t-=ROUNDS[next].step;
    }
  }
  showReceipt(S.round,snap,()=>enterRound(next));
});

/* ═══ OUTCOME: what the allocation tracked ════════════════
   Rank correlation between the dollars committed and each
   density measure. It reports the shape of the decision, not
   a verdict on it — there is deliberately no score.
   ═════════════════════════════════════════════════════════ */
function ranks(v){
  const idx=v.map((x,i)=>[x,i]).sort((a,b)=>a[0]-b[0]), r=new Array(v.length);
  let i=0;
  while(i<idx.length){
    let j=i; while(j+1<idx.length && idx[j+1][0]===idx[i][0]) j++;
    const avg=(i+j)/2+1;
    for(let k=i;k<=j;k++) r[idx[k][1]]=avg;
    i=j+1;
  }
  return r;
}
function pearson(a,b){
  const n=a.length, ma=a.reduce((x,y)=>x+y,0)/n, mb=b.reduce((x,y)=>x+y,0)/n;
  let num=0,da=0,db=0;
  for(let i=0;i<n;i++){ const x=a[i]-ma, y=b[i]-mb; num+=x*y; da+=x*x; db+=y*y; }
  return (da===0||db===0) ? null : num/Math.sqrt(da*db);
}
const MEASURE_KEYS=[["arith","Arithmetic"],["physio","Physiological"],["agri","Agricultural"]];
function trackReport(alloc){
  const money=CANDIDATES.map(c=>alloc[c.id]);
  const rows=MEASURE_KEYS.map(([k,label])=>{
    const rho=pearson(ranks(money),ranks(CANDIDATES.map(c=>c[k])));
    return {k,label,rho};
  });
  const flat = rows.every(r=>r.rho===null);
  const best = flat?null:rows.slice().filter(r=>r.rho!==null).sort((a,b)=>b.rho-a.rho)[0];
  return {rows,best,flat};
}
function strengthWord(rho){
  if(rho===null) return "—";
  if(rho>=0.7) return "closely";
  if(rho>=0.3) return "loosely";
  if(rho>-0.3) return "not at all";
  return "inversely";
}
function showReceipt(round,alloc,then){
  const t=trackReport(alloc);
  const card=document.getElementById("receiptcard");
  const head = t.flat
    ? 'You spread the fund evenly across all five. That is a decision not to rank them — '+
      'no measure on file tracks it.'
    : (t.best.rho>=0.3
        ? 'Your money followed <b>'+t.best.label.toLowerCase()+' density</b> more closely than '+
          'any other measure on file.'
        : 'Your money did not follow any density measure on file closely. That may be deliberate — '+
          'it should be defensible.');
  card.innerHTML=
    '<div class="k">GLOBAL FOOD SECURITY UNIT &middot; CASE 2.1-EGY</div>'+
    '<h3>Allocation recorded</h3>'+
    '<p class="head">'+head+'</p>'+
    t.rows.map(r=>{
      const w = r.rho===null?0:Math.max(0,r.rho)*100;
      return '<div class="rrow"><span class="lab">'+r.label+'</span>'+
        '<span class="track"><i style="width:'+w.toFixed(0)+'%"></i></span>'+
        '<span class="w">'+strengthWord(r.rho)+'</span></div>';
    }).join("")+
    '<div class="foot"><span class="note">This is a description of your allocation, not a mark. '+
    'It is recorded on your recommendation.</span>'+
    '<button class="btn" id="receiptGo">'+(round===4?"Continue":"Round "+(round+1))+'</button></div>';
  document.getElementById("receipt").classList.add("on");
  document.getElementById("receiptGo").addEventListener("click",()=>{
    document.getElementById("receipt").classList.remove("on"); then();
  });
}

const COACH=[
  { sel:".col.rail", side:"right", h:"Case File",
    t:"Every document you have been issued. A red dot means unread. New evidence lands here at the start of each round — and one document is always sealed until later." },
  { sel:".col.doc", side:"left", h:"The open document",
    t:"Round 1 gives you population, land area, and settlement pattern. Nothing else. Use <em>Viewing As</em> at the top to switch between the figures and the country profiles." },
  { sel:".col.alloc", side:"left", h:"Allocation",
    t:"Divide the fund here in $5M steps. All of it must be committed before the round will lock." },
  { sel:"#lockBtn", side:"left", h:"Locking a round",
    t:"Locking records your allocation and releases the next batch of evidence. It will stay greyed out until the fund is fully committed and the deliberation below the document is done." }
];
let coachIdx=0, coachHole=null, coachTip=null, coachDim=null;
function startCoach(){ coachIdx=0; drawCoach(); window.addEventListener("resize",drawCoach); }
function endCoach(){
  window.removeEventListener("resize",drawCoach);
  if(coachHole) coachHole.remove();
  if(coachTip) coachTip.remove();
  if(coachDim) coachDim.forEach(d=>d.remove());
  coachHole=coachTip=coachDim=null;
}
function drawCoach(){
  const step=COACH[coachIdx]; if(!step) return endCoach();
  const el=document.querySelector(step.sel); if(!el) return endCoach();
  const r=el.getBoundingClientRect(), pad=4;
  if(!coachHole){
    coachDim=["t","r","b","l"].map(()=>{
      const d=document.createElement("div"); d.className="coach-dim";
      document.body.appendChild(d); return d;
    });
    coachHole=document.createElement("div"); coachHole.className="coach-hole";
    document.body.appendChild(coachHole);
    coachTip=document.createElement("div"); coachTip.className="coach-tip";
    document.body.appendChild(coachTip);
  }
  const W=window.innerWidth, H=window.innerHeight;
  const x1=Math.max(0,r.left-pad), y1=Math.max(0,r.top-pad),
        x2=Math.min(W,r.right+pad), y2=Math.min(H,r.bottom+pad);
  const place=(el,l,t,w,h)=>Object.assign(el.style,
    {left:l+"px",top:t+"px",width:Math.max(0,w)+"px",height:Math.max(0,h)+"px"});
  place(coachDim[0], 0,  0,  W,     y1);        // above
  place(coachDim[1], x2, y1, W-x2,  y2-y1);     // right
  place(coachDim[2], 0,  y2, W,     H-y2);      // below
  place(coachDim[3], 0,  y1, x1,    y2-y1);     // left
  Object.assign(coachHole.style,{
    left:(r.left-pad)+"px", top:(r.top-pad)+"px",
    width:(r.width+pad*2)+"px", height:(r.height+pad*2)+"px"
  });
  coachTip.innerHTML='<h4>'+step.h+'</h4><p>'+step.t+'</p><div class="row">'+
    '<span class="step">'+(coachIdx+1)+' of '+COACH.length+'</span>'+
    '<button class="btn sm ghost" id="coachSkip">Skip</button>'+
    '<button class="btn sm" id="coachNext">'+(coachIdx===COACH.length-1?"Start":"Next")+'</button></div>';
  const tw=272, th=coachTip.offsetHeight||150;
  let left = step.side==="right" ? r.right+14 : r.left-tw-14;
  left = Math.max(10, Math.min(window.innerWidth-tw-10, left));
  let top = Math.max(10, Math.min(window.innerHeight-th-10, r.top + r.height/2 - th/2));
  Object.assign(coachTip.style,{left:left+"px", top:top+"px"});
  document.getElementById("coachNext").addEventListener("click",()=>{coachIdx++;drawCoach();});
  document.getElementById("coachSkip").addEventListener("click",endCoach);
}

/* ═══ INSTRUCTOR NOTES ════════════════════════════════════ */
document.getElementById("toNotes").addEventListener("click",()=>{
  document.getElementById("notespage").innerHTML=NOTES_HTML;
  document.getElementById("notes").classList.add("on");
  document.getElementById("backNotes").addEventListener("click",()=>
    document.getElementById("notes").classList.remove("on"));
});
const NOTES_HTML = `
<h1>Instructor Notes</h1>
<p style="color:var(--ink-2)">The Allocation — a decision lab for AMSCO Topic 2.1, Population Distribution.
Students work in pairs at one machine. Runtime is about 35 minutes.</p>

<h2>What it teaches</h2>
<ul>
<li>Arithmetic, physiological, and agricultural density, computed by hand and used to decide something.</li>
<li>That each measure, used alone, produces a defensibly wrong answer.</li>
<li>That distribution and density are different things — Round 3 is built entirely on this.</li>
<li>Vocabulary in play: <em>population distribution, population density, arithmetic density,
physiological density, agricultural density, arable, carrying capacity</em> (previewed).</li>
</ul>

<h2>Solo or paired</h2>
<p>The sign-in screen offers <strong>With a partner</strong> or <strong>On my own</strong>.
Paired is the default and the mode the lab was designed around — the deliberation gates exist to
force the conversation. Solo mode drops the second name field, reworks the prompts that assume
someone to argue with ("settle between you" becomes "work out why"), and prints a single signature
line. Use it for absences, make-up work, or homework. Everything else is identical.</p>

<h2>How students are oriented</h2>
<p>No teacher preamble is required — the lab briefs itself in three layers:</p>
<ul>
<li><strong>The assignment screen</strong>, after sign-in. In-fiction, about 150 words: who they
are, what they decide, and the three interface rules. The <code>?</code> in the top bar reopens it
at any point.</li>
<li><strong>Four coachmarks</strong> on Round 1 only, spotlighting the Case File, the document pane,
the Allocation panel, and the lock button. Skippable in one click.</li>
<li><strong>A worked example in the Calculation Bench</strong>, which appears at the moment the
bench first does — Bangladesh, 167,030,000 ÷ 33,819 = 4,939. Nothing about physiological density is
explained before students need it.</li>
</ul>
<p>Budget about three minutes for all of it. If you would rather brief the class yourself, have
them click <em>Skip the walkthrough</em>.</p>

<h2>Timing</h2>
<ul>
<li><strong>0–3</strong> Sign-in, assignment screen, walkthrough, Briefing 01.</li>
<li><strong>3–8</strong> Round 1 lock — arithmetic density only.</li>
<li><strong>8–18</strong> Round 2 — Arable Land Survey. Calculation Bench. <em>The pivot.</em></li>
<li><strong>18–25</strong> Round 3 — Sudan data revision.</li>
<li><strong>25–33</strong> Final round — Economic Annex and the fund cut.</li>
<li><strong>33–35</strong> Memo printed and signed.</li>
</ul>
<p>If you are running short, Round 3 is the one to compress — tell pairs to read the revision
and re-lock without re-arguing. Do not compress Round 2.</p>

<h2>All three densities, all computed</h2>
<p>Every density is worked by hand on the Calculation Bench, not just read off a table:</p>
<ul>
<li><strong>Round 1 — arithmetic</strong> (Egypt, Sudan). A deliberately easy warm-up whose real
job is teaching the bench interface while the stakes are low, so Round 2 is not a new tool and a
new concept at once.</li>
<li><strong>Round 2 — physiological</strong> (Egypt, Yemen, Niger). The pivot.</li>
<li><strong>Round 4 — agricultural</strong> (Niger, Bangladesh). Deliberately the two countries
that set up the trap: 85 against 431.</li>
</ul>
<p>Round 3 has no bench — it is about interpretation, not calculation.</p>

<h2>Maps</h2>
<ul>
<li><strong>Dot density maps</strong> (Round 1) on real Natural Earth outlines, one dot =
500,000 people. Egypt's Nile ribbon is the whole lesson in one picture; Niger's empty north and
Bangladesh's uniform saturation do the same job for the other two AMSCO patterns.</li>
<li><strong>Arable land figure</strong> (Round 2) — each country's total area as a square, with
its arable share drawn to scale inside. Egypt's block is tiny and exact.</li>
<li><strong>Density Comparison map series</strong> — the same five outlines shaded by whichever
density you pick. Egypt is one of the palest countries on arithmetic and the darkest on
physiological. Worth putting on the projector during the debrief.</li>
</ul>
<p>Dot placement is a cartographic generalisation built from real city locations and settlement
corridors, not census tract data — the maps say so, and that is worth a sentence in class.</p>

<h2>Outcomes — and what they deliberately are not</h2>
<p>There is no score, no simulated death toll, and no reveal of a "correct" split. Instead:</p>
<ul>
<li><strong>A receipt after every lock</strong> reporting which density measure their money
actually tracked — a rank correlation between their dollars and each measure. It describes the
shape of their decision without grading it.</li>
<li><strong>The Mirror</strong> on the memo: the four receipts in a row. A pair moving
<em>arithmetic &rarr; physiological &rarr; physiological</em> can see their own reasoning change.
A flat row is its own finding.</li>
<li><strong>Case Closed</strong> before the memo — sourced real-world facts, including that the
2024 UN humanitarian appeal was funded at roughly 43% and the 2025 appeal at under 17% by
mid-year. The 40% cut in Round 4 is gentler than reality, and students should know that.</li>
</ul>

<h2>Answer key — the reasoning you are listening for</h2>
<ul>
<li><strong>Round 1.</strong> Bangladesh dominates on arithmetic density (2,914). Egypt looks safe at
226 — fourth of five. Most pairs underfund Egypt badly. That is the intended trap.</li>
<li><strong>Round 2.</strong> Egypt is 2.8% arable, so its physiological density is ~8,077 — the highest
in the case. Yemen (2.2% arable) is ~6,909. Bangladesh <em>falls</em> in the ranking despite the
highest arithmetic density, because 59% of it is farmland. The sentence you want to hear:
<em>"nothing about Egypt changed — we changed the denominator."</em></li>
<li><strong>Japan.</strong> Physiological density 8,218, higher than Egypt's, and not a candidate.
AMSCO answers it directly: a wealthy country imports the difference. Egypt cannot pay as easily.
Density measures need, not capacity to meet it.</li>
<li><strong>Round 3.</strong> Sudan's national densities do not move, because national totals did not
move — 11 million people were redistributed <em>inside</em> the total. Density is an average over a
territory and cannot see a redistribution within it. This is the p.58 A/B/C diagram, live.</li>
<li><strong>Round 4 — the deliberate trap.</strong> Sorted by agricultural density, Sudan (~46) and
Niger (~85) sit nearer the Netherlands (31) than Bangladesh (431). Students who learned
"low agricultural density = mechanised and developed" will read this backwards. The resolution is
the yield column: Netherlands 8.9 t/ha, Niger 0.5. Low agricultural density here means marginal land
and few people, not tractors. Expect this to be the argument of the period — let it run.</li>
</ul>

<h2>Data note — please read before class</h2>
<p>Figures are CIA World Factbook-era (2018–2022), chosen so Egypt and Bangladesh reproduce the
densities printed in the AMSCO table. Egypt computes to 8,077/sq. mi. against the book's published
8,078 — rounding in the source. The Calculation Bench accepts ±3% so this never blocks a pair.</p>
<p><strong>Farmer counts are estimates</strong> derived from agricultural share of employment, not
direct census counts, so agricultural densities are approximate. That is worth saying out loud —
it is a real property of the measure, not a flaw in the lab.</p>
<p>Sudan, Yemen, and Niger are in active humanitarian emergencies and the figures move. Check them
against a current source before you run this, and tell students the numbers are real.</p>

<h2>Tone</h2>
<p>There is no score and no win screen, deliberately. The subject is famine risk affecting real
people, and the lab is built to read as sober analysis rather than a game. If a pair asks
"did we get it right?", the honest answer is that real analysts disagree about this and the
defence is what is being assessed — which is what the memo captures.</p>

<h2>Assessment</h2>
<p>The printed memo carries both names, all four allocations, the density figures, and four written
justifications. The most useful thing on it is the round-by-round table: a pair whose allocation
never moved either reasoned exceptionally well in Round 1 or stopped reading after it, and the
written answers tell you which.</p>

<h2>Sources</h2>
<ul>
<li>Population, area, and arable land: CIA World Factbook country profiles (2018–2022 estimates).</li>
<li>Comparison table densities: AMSCO <em>Human Geography: AP Edition</em>, Topic 2.1, p. 59.</li>
<li>Sudan displacement scale: UN humanitarian reporting, 2023 onward.</li>
</ul>
<div class="memoactions"><button class="btn" id="backNotes">Back to sign-in</button></div>
`;
